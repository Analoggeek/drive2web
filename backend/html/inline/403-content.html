<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=300, initial-scale=1" name="viewport">
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>Content blocked</title>
<base href="{{WEB_URL}}">
</head>
<body>
    <h1 class="bar alert">Security warning</h1>
    <div class="main instructions">
        <p>This page is blocked for your safety as it has been reported to contain malicious content.</p>
    </div>
    <div id="footnotes">
        <div class="left">
            <a href="/">Home / Sign-in</a>
            <a href="/tos.html" target="_blank">Terms</a>
            <a href="/privacy.html" target="_blank">Privacy</a>
            <a href="https://twitter.com/drv_tw" target="_blank">Twitter</a>
            <a href="mailto:{{CONTACT_EMAIL}}" id="mailto">Email</a>
            <a href="{{WEB_URL}}/docs" target="_blank">Docs</a>
            <a href="/supportus.html" title="Your support is greatly appreciated!" 
                class="highlight">Support us</a>
        </div>
        <div class="right">
            <div id="google_translate_element"></div>
        </div>
    </div>
<noscript id="deferred-styles">
    <link rel="stylesheet" type="text/css" href="/inc/wd.css">
    <link rel="stylesheet" type="text/css" href="/inc/wd-s.css" media="screen and (max-width: 580px)">
</noscript>
<script type="text/javascript" nonce="{{CSP_NONCE}}">
if(self!=top){
    window.onclick = function(){window.open("{{WEB_URL}}")} ;
    setTimeout( function(){top.location.href="{{WEB_URL}}"}, 0 ) ;
}
else{
    // Load deferred styles
    var loadDeferredStyles = function() {
        var addStylesNode = document.getElementById("deferred-styles");
        var replacement = document.createElement("div");
        replacement.innerHTML = addStylesNode.textContent;
        document.body.appendChild(replacement)
        addStylesNode.parentElement.removeChild(addStylesNode);
    };
    window.addEventListener('load', loadDeferredStyles);
    document.getElementById('mailto').setAttribute('href','mailto:{{CONTACT_EMAIL}}?subject='+encodeURIComponent('Blocked '+location.href));
}
function googleTranslateElementInit() {new google.translate.TranslateElement({pageLanguage: 'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE, gaTrack: false}, 'google_translate_element');}
</script><script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
